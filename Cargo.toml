[workspace]
resolver = "2"
members = [
    "crates/carplay-iap2",
    "crates/carplay-mfi",
    "crates/carplay-airplay",
    "crates/carplay-transport",
    "crates/platform-embedded",
    "crates/carplay-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Ricardo Vieira <hi@ricvieira.com>"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.8"
byteorder = "1.5"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.6"
uuid = { version = "1.11", features = ["v4"] }

# Crypto primitives for AirPlay / HomeKit / MFiSAP / SRP-6a
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
aes = "0.8"
ctr = "0.9"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
num-bigint = "0.4"
num-traits = "0.2"

# Internal workspace crates
carplay-iap2 = { path = "crates/carplay-iap2" }
carplay-mfi = { path = "crates/carplay-mfi" }
carplay-airplay = { path = "crates/carplay-airplay" }
carplay-transport = { path = "crates/carplay-transport" }
platform-embedded = { path = "crates/platform-embedded" }
